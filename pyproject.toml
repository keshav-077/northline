[project]
name = "northline"
version = "1.0.0"
description = "Historical day-ahead wind desk for January 2026 GB procurement decisions."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "tzdata==2025.2",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
